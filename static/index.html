<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chronicle</title><style>body{font:16px system-ui;background:#0b1020;color:#eef;padding:28px;max-width:900px;margin:auto}h1{margin-bottom:4px}small{color:#9ca8c7}.card{background:#151e35;border:1px solid #2a385a;border-radius:14px;padding:20px;margin:18px 0}button{background:#6ee7b7;border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer}input{background:#0b1020;color:#eef;border:1px solid #405071;border-radius:7px;padding:10px;margin:4px;width:42%}pre{white-space:pre-wrap;color:#c7d2fe}.pill{color:#6ee7b7}</style><h1>Chronicle</h1><small>Temporal agent memory · HydraDB graph-backed</small><div class=card><p>Ask for a current fact, inspect its history, or test disciplined abstention.</p><input id=s value=Emmanuel placeholder=Subject><input id=p value=preferred_editor placeholder=Predicate><br><button onclick="run('/memory/current')">Current truth</button> <button onclick="run('/memory/history')">History</button> <button onclick="run('/memory/abstain')">Abstain check</button><pre id=o>Ready.</pre></div><script>async function run(path){o.textContent='Querying HydraDB…';let r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({subject:s.value,predicate:p.value})});o.textContent=JSON.stringify(await r.json(),null,2)}</script>
